[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-answer-tracker"
version = "0.1.0"
description = "Ask a CSV of questions to several LLMs on a schedule, keep dated answers, rank them, publish a report."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
